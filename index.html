<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTC At Mines</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        /* Layout */
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Left: Dynamic Image Grid */
        .left-content {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            padding: 20px;
            overflow-y: auto;
        }

        .left-content img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .left-content img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* Right: Google Doc */
        .right-content {
            flex: 0.5;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #fff;
            box-shadow: -4px 0 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .right-content iframe {
            flex-grow: 1;
            border: none;
            border-radius: 8px;
            width: 100%;
        }

        /* Title Section */
        .title {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Montserrat', sans-serif;
        }

        .title h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0077b6;
            margin-bottom: 10px;
        }

        .title p {
            font-size: 1.1rem;
            color: #555;
            font-weight: 400;
        }

        /* Links Section */
        .links {
            text-align: center;
            margin-bottom: 20px;
        }

        .links a {
            display: inline-block;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            color: #0077b6;
            background-color: #e9f5ff;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .links a:hover {
            background-color: #0077b6;
            color: #fff;
        }

        /* Password Section */
        #passwordSection {
            text-align: center;
            margin-top: 20px;
        }

        #passwordInput {
            padding: 10px;
            border: 2px solid #0077b6;
            border-radius: 5px;
            font-size: 1rem;
            width: 200px;
            outline: none;
        }

        button {
            padding: 10px 15px;
            background-color: #0077b6;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #023e8a;
        }
    </style>
</head>
<body>

    <!-- Password Section -->
    <div id="passwordSection">
        <h2>Enter Password to Access Content</h2>
        <input type="password" id="passwordInput" placeholder="Enter Password">
        <button onclick="checkPassword()">Submit</button>
    </div>

    <!-- Protected Content -->
    <div id="protectedContent" style="display: none;">
        <div class="container">

            <!-- Left Side: Dynamic Image Grid -->
            <div class="left-content">
                <div class="title">
                    <h1>ROTC At Mines</h1>
                    <p>Bravo Company</p>
                </div>

                <!-- Images -->
                <img src="IMG_6672.jpeg" alt="ROTC Event">
                <img src="IMG_6538.JPG" alt="ROTC Event">
                <img src="IMG_6010.JPG" alt="ROTC Event">
                <img src="Ranger Buddy.jpeg" alt="ROTC Event">
                <img src="DSC00474.JPG" alt="ROTC Event">
            </div>

            <!-- Right Side: Google Doc -->
            <div class="right-content">
                <div class="links">
                    <a href="https://forms.gle/JXyBHUWzjDMtZfuo7" target="_blank">Functionalities Survey</a>
                </div>

                <iframe 
                    src="https://docs.google.com/document/d/1K_-lEaRrAZeslwE18AncUfLaX73ePar0us0vjOd41t4/preview">
                </iframe>
            </div>

        </div>
    </div>

    <script>
        function checkPassword() {
            const correctPassword = "tism";
            const enteredPassword = document.getElementById("passwordInput").value;

            if (enteredPassword === correctPassword) {
                document.getElementById("passwordSection").style.display = "none";
                document.getElementById("protectedContent").style.display = "flex";
            } else {
                alert("Incorrect password! Please try again.");
            }
        }
    </script>
</body>
</html>
